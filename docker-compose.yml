x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: 100M

services:

  db:
    image: pgvector/pgvector:pg16
    container_name: RepoMind_DB
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
      
    volumes:
      - app_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

    <<: *default-logging
  redis:
    image: redis:alpine
    container_name: repo-brain-redis

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

    command: ["redis-server", "--appendonly", "yes"]

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    <<: *default-logging

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: repo_mind_worker
    command: ["bun", "run", "worker:indexing"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"

    <<: *default-logging

volumes:
  redis-data:
  app_db_data:
